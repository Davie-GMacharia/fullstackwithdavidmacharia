<style>
:root{
  --ink:#0D1210;
  --ink-2:#141B18;
  --paper:#F4F6F1;
  --signal:#5EEAD4;
  --signal-dim:#2E7D6F;
  --amber:#E8B65A;
  --line:rgba(244,246,241,0.12);
  --text:#F4F6F1;
  --text-dim:#9BA69F;
  --radius:18px;
  --font-display:'Fraunces', serif;
  --font-mono:'JetBrains Mono', monospace;
  --font-body:'Inter', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
}
::selection{background:var(--signal); color:var(--ink);}

/* background grid texture */
.bg-grid{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(244,246,241,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(244,246,241,0.035) 1px, transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 100%);
}

/* Liquid glass */
.glass{
  position:relative;
  background:rgba(244,246,241,0.06);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid rgba(244,246,241,0.14);
  box-shadow:
    inset 0 1px 0 rgba(244,246,241,0.18),
    inset 0 -1px 0 rgba(0,0,0,0.2),
    0 8px 30px -10px rgba(0,0,0,0.6);
}
.glass-btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:13px 26px;
  border-radius:100px;
  font-family:var(--font-body);
  font-weight:600;
  font-size:14.5px;
  color:var(--text);
  text-decoration:none;
  border:none;
  cursor:pointer;
  transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
}
.glass-btn:hover{ transform:translateY(-2px); }
.glass-btn:active{ transform:translateY(0) scale(.98); }
.glass-btn.primary{
  background:linear-gradient(135deg, rgba(94,234,212,0.9), rgba(46,125,111,0.85));
  color:#0D1210;
  border:1px solid rgba(94,234,212,0.5);
  box-shadow:0 8px 24px -8px rgba(94,234,212,0.4);
}
.glass-btn.neutral{
  background:rgba(244,246,241,0.06);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid rgba(244,246,241,0.16);
}
.glass-btn.neutral:hover{ background:rgba(244,246,241,0.1); }
.glass-btn.sm{ padding:9px 18px; font-size:13px; }

/* Layout */
.wrap{ max-width:1120px; margin:0 auto; padding:0 24px; position:relative; z-index:1;}
main{ min-height:100vh; padding-bottom:140px; }
.eyebrow{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--signal);
  display:flex; align-items:center; gap:10px;
}
.eyebrow::before{ content:''; width:8px; height:8px; border-radius:50%; background:var(--signal); box-shadow:0 0 12px var(--signal); }
h1,h2,h3{ font-family:var(--font-display); font-weight:500; letter-spacing:-0.01em; }
.text-dim{ color:var(--text-dim); }
a{ color:inherit; }

/* Hero */
.hero{ padding:110px 0 80px; position:relative; }
.hero-title{
  font-size:clamp(2.6rem, 6vw, 4.6rem);
  line-height:1.02;
  margin-top:18px;
}
.hero-title .accent{ color:var(--signal); font-style:italic; }
.hero-sub{
  margin-top:24px; max-width:560px;
  font-size:18px; line-height:1.65; color:var(--text-dim);
}
.hero-actions{ margin-top:36px; display:flex; gap:14px; flex-wrap:wrap; }
.hero-tags{ margin-top:56px; display:flex; gap:28px; flex-wrap:wrap; font-family:var(--font-mono); font-size:12.5px; color:var(--text-dim); }
.hero-tags span{ display:flex; align-items:center; gap:8px; }
.hero-tags .dot{ width:6px; height:6px; border-radius:50%; background:var(--signal-dim); }

/* Signature: pulse/terminal cursor strip */
.signal-strip{
  margin-top:64px; height:70px; border-radius:14px;
  display:flex; align-items:center; padding:0 22px; gap:2px;
  overflow:hidden;
}
.signal-strip .bar{
  width:4px; background:var(--signal); opacity:.35; border-radius:2px;
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{ height:8px; opacity:.25;} 50%{ height:34px; opacity:.9;} }
@media (prefers-reduced-motion: reduce){ .signal-strip .bar{ animation:none; height:16px; opacity:.5;} }

/* Section headers */
.section{ padding:70px 0; }
.section-head{ max-width:640px; }
.section-head h2{ font-size:clamp(1.9rem,3.4vw,2.7rem); margin-top:10px; }
.section-head p{ margin-top:14px; color:var(--text-dim); font-size:16px; line-height:1.6; }

/* Service cards */
.grid{ display:grid; gap:16px; margin-top:44px; }
.grid.services{ grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); }
.card{
  border-radius:var(--radius);
  padding:26px;
  display:flex; flex-direction:column;
  text-decoration:none; color:var(--text);
  transition:transform .3s ease, border-color .3s ease;
  cursor:pointer;
}
.card:hover{ transform:translateY(-4px); border-color:rgba(94,234,212,0.35); }
.card .icon{
  width:42px; height:42px; border-radius:12px;
  background:rgba(94,234,212,0.12); color:var(--signal);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:16px; margin-bottom:18px;
}
.card h3{ font-size:21px; margin-bottom:8px; }
.card .tag{ font-family:var(--font-mono); font-size:12px; color:var(--text-dim); margin-bottom:14px; }
.card p{ color:var(--text-dim); font-size:14.5px; line-height:1.55; flex:1; }
.card .price{ margin-top:18px; font-family:var(--font-mono); font-size:13px; color:var(--signal); display:flex; justify-content:space-between; align-items:center; }

/* Dock nav — macOS style */
.dock-wrap{ position:fixed; left:0; right:0; bottom:18px; z-index:50; display:flex; justify-content:center; padding:0 14px; pointer-events:none;}
.dock{
  pointer-events:all;
  display:flex; align-items:flex-end; gap:6px;
  padding:10px 12px; border-radius:26px;
  background:rgba(20,27,24,0.55);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(244,246,241,0.14);
  box-shadow:0 20px 50px -12px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
}
.dock-item{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  width:54px; height:54px; border-radius:16px;
  color:var(--text-dim); text-decoration:none;
  transition:transform .22s cubic-bezier(.2,.8,.2,1), background .22s ease, color .22s ease;
  transform-origin:bottom center;
  position:relative;
}
.dock-item svg{ width:20px; height:20px; }
.dock-item span{ font-family:var(--font-mono); font-size:8.5px; margin-top:3px; letter-spacing:.02em; }
.dock-item:hover{ transform:translateY(-10px) scale(1.18); background:rgba(244,246,241,0.08); color:var(--text); }
.dock-item.active{ color:var(--signal); background:rgba(94,234,212,0.1); }
.dock-item.active::after{
  content:''; position:absolute; bottom:-2px; left:50%; transform:translateX(-50%);
  width:4px; height:4px; border-radius:50%; background:var(--signal); box-shadow:0 0 8px var(--signal);
}

/* Service detail */
.detail-meta{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-top:34px; }
.detail-meta .box{ border-radius:14px; padding:18px 20px; }
.detail-meta .box .label{ font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); }
.detail-meta .box .value{ margin-top:6px; font-size:17px; font-weight:600; }
.offerings{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; margin-top:24px; }
.offering{ border-radius:14px; padding:20px; }
.offering h4{ font-size:16px; margin-bottom:8px; display:flex; gap:10px; align-items:flex-start; font-family:var(--font-body); font-weight:600;}
.offering p{ color:var(--text-dim); font-size:14px; line-height:1.55; }
.stack-pills{ display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
.pill{ padding:8px 16px; border-radius:100px; font-family:var(--font-mono); font-size:12.5px; }
.process-list{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:24px; counter-reset:step; }
.process-item{ border-radius:14px; padding:22px; }
.process-item .num{ font-family:var(--font-mono); color:var(--signal-dim); font-size:26px; }
.process-item h4{ margin-top:8px; font-size:17px; font-weight:600; }
.process-item p{ margin-top:8px; color:var(--text-dim); font-size:13.5px; line-height:1.5; }

/* Estimate calculator */
.calc{
  border-radius:24px; padding:32px; margin-top:36px;
  display:grid; gap:36px; grid-template-columns:1.3fr 1fr;
}
@media (max-width:900px){ .calc{ grid-template-columns:1fr; } }
.calc-step h3{ font-size:19px; margin-bottom:14px; font-family:var(--font-body); font-weight:600;}
.chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  padding:10px 18px; border-radius:12px; font-size:14px; cursor:pointer;
  background:rgba(244,246,241,0.05); border:1px solid rgba(244,246,241,0.12);
  transition:all .2s ease; color:var(--text);
  font-family:var(--font-body);
}
.chip:hover{ background:rgba(244,246,241,0.09); }
.chip.active{
  background:linear-gradient(135deg, rgba(94,234,212,0.9), rgba(46,125,111,0.85));
  color:#0D1210; border-color:transparent; font-weight:600;
}
.range-wrap{ margin-top:6px; }
input[type=range]{
  width:100%; accent-color:var(--signal); height:6px; border-radius:4px;
  background:rgba(244,246,241,0.1); cursor:pointer;
}
.range-labels{ display:flex; justify-content:space-between; margin-top:6px; font-family:var(--font-mono); font-size:11px; color:var(--text-dim); }
.calc-side{ border-radius:20px; padding:26px; align-self:start; position:sticky; top:20px; }
.calc-side .label{ font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-dim); display:flex; gap:8px; align-items:center;}
.calc-total{ font-family:var(--font-display); font-size:34px; margin-top:12px; line-height:1.1; }
.calc-total .sep{ color:var(--text-dim); font-family:var(--font-body); }
.calc-meta{ margin-top:10px; font-size:13.5px; color:var(--text-dim); }
.calc-lines{ margin-top:22px; padding-top:18px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:9px; }
.calc-lines .line{ display:flex; justify-content:space-between; font-size:13.5px; color:var(--text-dim); }
.calc-lines .line b{ color:var(--text); font-weight:500; }
.calc-actions{ margin-top:22px; display:flex; gap:10px; flex-wrap:wrap; }
.calc-note{ margin-top:16px; font-size:12px; color:var(--text-dim); line-height:1.5; }

/* Contact */
.contact-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-top:36px; }
.contact-card{ border-radius:18px; padding:24px; text-decoration:none; color:var(--text); display:flex; flex-direction:column; gap:14px; transition:transform .25s ease; }
.contact-card:hover{ transform:translateY(-4px); }
.contact-card .ic{ width:44px; height:44px; border-radius:12px; background:rgba(94,234,212,0.12); color:var(--signal); display:flex; align-items:center; justify-content:center; }
.contact-card .l{ font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); }
.contact-card .v{ font-size:18px; font-weight:600; word-break:break-word; }
.contact-card .n{ font-size:13px; color:var(--text-dim); line-height:1.5; }
.avail-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; margin-top:16px; }
.avail-box{ border-radius:16px; padding:20px; font-size:14px; color:var(--text-dim); display:flex; gap:12px; }

footer{ padding:40px 0 160px; text-align:center; color:var(--text-dim); font-family:var(--font-mono); font-size:12px; }

/* about */
.about-grid{ display:grid; grid-template-columns:0.9fr 1.1fr; gap:48px; align-items:start; margin-top:40px; }
@media (max-width:860px){ .about-grid{ grid-template-columns:1fr; } }
.about-photo{ border-radius:24px; padding:8px; aspect-ratio:1; }
.about-photo .ph{ width:100%; height:100%; border-radius:18px; background:linear-gradient(135deg, rgba(94,234,212,0.18), rgba(232,182,90,0.12)); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:80px; color:var(--signal); }
.about-copy p{ color:var(--text-dim); line-height:1.75; font-size:16px; margin-bottom:16px; }
.edu-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:20px;}
.edu-card{ border-radius:16px; padding:22px; }
.edu-card .ic{ width:38px; height:38px; border-radius:10px; background:rgba(94,234,212,0.12); color:var(--signal); display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
.edu-card h4{ font-size:16px; font-weight:600; }
.edu-card .inst{ font-size:13px; color:var(--signal-dim); margin-top:2px; }
.edu-card p{ margin-top:10px; font-size:13px; color:var(--text-dim); line-height:1.5; }

.hidden{ display:none !important; }
.back-link{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:12.5px; color:var(--text-dim); text-decoration:none; margin-bottom:20px; }
.back-link:hover{ color:var(--signal); }
</style>

function calcResult(){
  const project = projectTypes.find(p=>p.id===calcState.type);
  const speed = timelineOpts.find(t=>t.id===calcState.timeline);
  const chosen = featureList.filter(f=>calcState.features.includes(f.id));
  const featureCost = chosen.reduce((a,f)=>a+f.cost,0);
  const pageCost = Math.max(0, calcState.pages-3)*6000;
  const subtotal = project.base + featureCost + pageCost;
  const total = subtotal * speed.mult;
  const weeks = (project.weeks + chosen.reduce((a,f)=>a+f.weeks,0) + Math.max(0,calcState.pages-3)*0.15) * (speed.id==="rush"?0.7:speed.id==="relaxed"?1.25:1);
  const lines = [{label:project.label, value:project.base}];
  if(pageCost) lines.push({label:`${calcState.pages} pages / screens`, value:pageCost});
  chosen.forEach(f=>lines.push({label:f.label, value:f.cost}));
  if(speed.mult!==1) lines.push({label:`${speed.label} timeline`, value: subtotal*(speed.mult-1)});
  return {project, low: total*0.9, high: total*1.15, weeks: Math.max(1, Math.round(weeks*10)/10), deposit: total*0.4, lines};
}

function renderCalc(){
  const typeEl = document.getElementById("c-type");
  const featEl = document.getElementById("c-features");
  const tlEl = document.getElementById("c-timeline");
  const pagesEl = document.getElementById("c-pages");
  if(!typeEl) return;

  typeEl.innerHTML = projectTypes.map(p=>`<div class="chip ${calcState.type===p.id?'active':''}" data-type="${p.id}">${p.label}</div>`).join("");
  featEl.innerHTML = featureList.map(f=>`<div class="chip ${calcState.features.includes(f.id)?'active':''}" data-feat="${f.id}">${f.label} <span style="opacity:.7;font-size:11px;">+${(f.cost/1000).toFixed(0)}k</span></div>`).join("");
  tlEl.innerHTML = timelineOpts.map(t=>`<div class="chip ${calcState.timeline===t.id?'active':''}" data-tl="${t.id}">${t.label} <span style="opacity:.7;font-size:11px;">${t.note}</span></div>`).join("");
  pagesEl.value = calcState.pages;
  document.getElementById("c-pages-val").textContent = calcState.pages;

  const r = calcResult();
  document.getElementById("c-total").innerHTML = `${fmtKes(r.low)} <span class="sep">–</span> ${fmtKes(r.high)}`;
  document.getElementById("c-meta").innerHTML = `Around <b style="color:var(--text);">${r.weeks} weeks</b> of work · deposit from ${fmtKes(r.deposit)}`;
  document.getElementById("c-lines").innerHTML = r.lines.map(l=>`<div class="line"><span>${l.label}</span><b>${fmtKes(l.value)}</b></div>`).join("");

  const msg = encodeURIComponent(`Hi David, I used your estimate calculator.\n\nProject: ${r.project.label}\nPages/screens: ${calcState.pages}\nFeatures: ${calcState.features.length? featureList.filter(f=>calcState.features.includes(f.id)).map(f=>f.label).join(", "):"None"}\nTimeline: ${timelineOpts.find(t=>t.id===calcState.timeline).label}\nEstimate: ${fmtKes(r.low)} – ${fmtKes(r.high)}\n\nCan we talk about it?`);
  document.getElementById("c-wa").href = `https://wa.me/${PHONE_INTL}?text=${msg}`;

  typeEl.querySelectorAll("[data-type]").forEach(el=>el.onclick=()=>{ calcState.type=el.dataset.type; renderCalc(); });
  featEl.querySelectorAll("[data-feat]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.feat;
    calcState.features = calcState.features.includes(id) ? calcState.features.filter(f=>f!==id) : [...calcState.features, id];
    renderCalc();
  });
  tlEl.querySelectorAll("[data-tl]").forEach(el=>el.onclick=()=>{ calcState.timeline=el.dataset.tl; renderCalc(); });
  pagesEl.oninput = (e)=>{ calcState.pages = Number(e.target.value); renderCalc(); };
  document.getElementById("c-reset").onclick = ()=>{ calcState = {type:"business", features:["design"], pages:6, timeline:"standard"}; renderCalc(); };
}

/* ---------------- RENDER LOOP ---------------- */
function render(){
  const {name, param} = getRoute();
  const app = document.getElementById("app");
  let html = "";
  if(name==="home") html = pageHome();
  else if(name==="about") html = pageAbout();
  else if(name==="services") html = pageServices();
  else if(name==="service") html = pageService(param);
  else if(name==="estimate") html = pageEstimate();
  else if(name==="contact") html = pageContact();
  app.innerHTML = html;
  renderDock(name==="service" ? "services" : name);
  if(document.getElementById("calc-root")) renderCalc();
  window.scrollTo({top:0, behavior:"instant"});
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
